<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Database & WhatsApp Queue - v5.7 Universal Recovery</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        * { box-sizing: border-box; }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-wa-queue {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .btn-back {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 4px;
            border-radius: 6px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
        }
        .stat-card .label {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 2px;
        }
        .controls-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .filter-row-stacked {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            font-size: 0.9rem;
        }
        .action-row {
            display: flex;
            gap: 8px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 0.85rem;
        }
        .btn-reset { background-color: #334155; }
        .btn-export { background-color: #d97706; }
        
        .lead-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 8px;
        }
        .lead-title h3 {
            margin: 0 0 2px 0;
            font-size: 1rem;
        }
        .lead-title p {
            margin: 0;
            font-size: 0.75rem;
            color: #64748b;
        }
        .badge-container {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-sent { background-color: #d1fae5; color: #065f46; }
        .badge-pending { background-color: #fee2e2; color: #991b1b; }
        
        .lead-details p {
            margin: 5px 0;
            font-size: 0.85rem;
            word-break: break-word;
        }
        .lead-details a {
            color: var(--primary);
            text-decoration: none;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .btn-action-wa {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            flex: 1;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view">
            <div class="header-bar">
                <h1>📊 Buyer Database v5.7</h1>
                <button class="btn-wa-queue" onclick="toggleView(true)">💬 WA Queue (<span id="queue-badge">0</span>)</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="stat-total">0</div>
                    <div class="label">Total Leads</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="stat-pending">0</div>
                    <div class="label">Pending WA</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="stat-sent">0</div>
                    <div class="label">WA Sent</div>
                </div>
            </div>

            <div class="controls-stack">
                <div class="filter-row-stacked">
                    <select id="categoryFilter" onchange="renderApp()">
                        <option value="All">All Categories</option>
                    </select>
                    <select id="statusFilter" onchange="renderApp()">
                        <option value="All">All Statuses</option>
                        <option value="New">Pending Outreach</option>
                        <option value="Contacted">Contacted / Sent</option>
                    </select>
                </div>
                <input type="text" id="searchInput" placeholder="Search company name or notes..." oninput="renderApp()">
                <div class="action-row">
                    <button class="btn btn-reset" onclick="resetDatabase()">🔄 Reset Defaults</button>
                    <button class="btn btn-export" onclick="exportCSV()">↓ Export CSV</button>
                </div>
            </div>

            <div id="leads-list"></div>
        </div>

        <!-- WHATSAPP QUEUE VIEW -->
        <div id="wa-queue-view" class="hidden">
            <div class="header-bar">
                <h1>💬 WhatsApp Queue</h1>
                <button class="btn-back" onclick="toggleView(false)">← Dashboard</button>
            </div>
            <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 10px;">Leads pending WhatsApp outreach:</p>
            <div id="queue-list"></div>
        </div>
    </div>

    <script>
        const ACTIVE_KEY = 'buyer_db_master_v57';

        const defaultLeads = [
            {
                id: 1,
                company: "IHG Hotels & Resorts",
                category: "Hotels & Hospitality",
                status: "New",
                waSent: false,
                mobile: "918774242449",
                website: "https://www.ihgplc.com",
                notes: "Multinational hospitality company expanding footprint in South India."
            }
        ];

        let leads = [];

        function loadData() {
            try {
                let bestDataset = [];
                
                // DYNAMIC STORAGE INSPECTOR: Scan ALL keys in localStorage to find your actual data
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const rawValue = localStorage.getItem(key);
                    try {
                        const parsed = JSON.parse(rawValue);
                        if (Array.isArray(parsed) && parsed.length > bestDataset.length) {
                            bestDataset = parsed;
                        }
                    } catch (err) {
                        // Not JSON, skip
                    }
                }

                if (bestDataset.length > 0) {
                    leads = bestDataset;
                } else {
                    leads = defaultLeads;
                }
                saveData();
            } catch (e) {
                leads = defaultLeads;
            }
        }

        function saveData() {
            localStorage.setItem(ACTIVE_KEY, JSON.stringify(leads));
        }

        function init() {
            loadData();
            populateCategories();
            renderApp();
        }

        function populateCategories() {
            const categories = [...new Set(leads.map(l => l.category))].filter(Boolean);
            const select = document.getElementById('categoryFilter');
            select.innerHTML = '<option value="All">All Categories</option>';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function updateStats() {
            const total = leads.length;
            const pending = leads.filter(l => !l.waSent && l.status !== 'Contacted').length;
            const sent = leads.filter(l => l.waSent || l.status === 'Contacted').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-sent').innerText = sent;
            document.getElementById('queue-badge').innerText = pending;
        }

        function markWaSent(id) {
            const lead = leads.find(l => l.id === id || l.mobile === id || l.company === id);
            if (lead) {
                lead.waSent = true;
                lead.status = 'Contacted';
                saveData();
                renderApp();
            }
        }

        function updateStatus(id, newStatus) {
            const lead = leads.find(l => l.id === id || l.mobile === id || l.company === id);
            if (lead) {
                lead.status = newStatus;
                if (newStatus === 'Contacted') lead.waSent = true;
                saveData();
                renderApp();
            }
        }

        function renderApp() {
            updateStats();
            const catVal = document.getElementById('categoryFilter').value;
            const statusVal = document.getElementById('statusFilter').value;
            const searchVal = (document.getElementById('searchInput').value || '').toLowerCase();

            const filtered = leads.filter(l => {
                const matchesCat = (catVal === 'All' || l.category === catVal);
                let matchesStatus = true;
                const isContacted = l.waSent || l.status === 'Contacted';
                if (statusVal === 'New') matchesStatus = !isContacted;
                if (statusVal === 'Contacted') matchesStatus = isContacted;
                
                const matchesSearch = (l.company || '').toLowerCase().includes(searchVal) || ((l.notes || '').toLowerCase().includes(searchVal));
                return matchesCat && matchesStatus && matchesSearch;
            });

            // Render Dashboard List (paginated display to prevent browser lag on large datasets)
            const listContainer = document.getElementById('leads-list');
            if (filtered.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">No matching leads found.</p>';
            } else {
                listContainer.innerHTML = filtered.slice(0, 100).map((l, index) => {
                    const uniqueId = l.id || l.mobile || l.company || index;
                    const isContacted = l.waSent || l.status === 'Contacted';
                    return `
                    <div class="lead-card">
                        <div class="lead-header">
                            <div class="lead-title">
                                <h3>${l.company || 'Unnamed Company'}</h3>
                                <p>${l.category || 'General'}</p>
                            </div>
                            <select onchange="updateStatus('${uniqueId}', this.value)" style="width: auto; padding: 4px 8px; font-size: 0.8rem;">
                                <option value="New" ${!isContacted ? 'selected' : ''}>New</option>
                                <option value="Contacted" ${isContacted ? 'selected' : ''}>Contacted</option>
                            </select>
                        </div>
                        <div class="badge-container">
                            <span class="badge ${isContacted ? 'badge-sent' : 'badge-pending'}">
                                WhatsApp: ${isContacted ? 'Sent' : 'Pending'}
                            </span>
                        </div>
                        <div class="lead-details">
                            <p><strong>📱 Mobile:</strong> ${l.mobile || 'N/A'}</p>
                            <p><strong>🌐 Web:</strong> <a href="${l.website || '#'}" target="_blank">${l.website || 'N/A'}</a></p>
                            <p><strong>📝 Notes:</strong> ${l.notes || 'No notes.'}</p>
                        </div>
                        <div class="card-actions">
                            <a href="https://wa.me/${l.mobile || ''}" target="_blank" class="btn-action-wa" onclick="markWaSent('${uniqueId}')">💬 Open WA Chat</a>
                        </div>
                    </div>
                `;
                }).join('') + (filtered.length > 100 ? '<p style="text-align:center; color:#64748b; font-size:0.8rem;">Showing first 100 results for performance...</p>' : '');
            }

            // Render WA Queue List
            const queueContainer = document.getElementById('queue-list');
            const pendingQueue = leads.filter(l => !l.waSent && l.status !== 'Contacted' && l.mobile);
            if (pendingQueue.length === 0) {
                queueContainer.innerHTML = '<p style="text-align: center; color: #64748b; padding: 20px;">All WhatsApp messages sent! 🎉</p>';
            } else {
                queueContainer.innerHTML = pendingQueue.slice(0, 100).map((l, index) => {
                    const uniqueId = l.id || l.mobile || l.company || index;
                    return `
                    <div class="lead-card">
                        <div class="lead-header">
                            <div class="lead-title">
                                <h3>${l.company || 'Unnamed Company'}</h3>
                                <p>${l.category || 'General'}</p>
                            </div>
                            <a href="https://wa.me/${l.mobile || ''}" target="_blank" class="btn-action-wa" style="padding: 6px 12px; font-size: 0.8rem;" onclick="markWaSent('${uniqueId}')">Open WA Chat</a>
                        </div>
                        <div class="lead-details">
                            <p><strong>📱 Mobile:</strong> ${l.mobile || 'N/A'}</p>
                            <p><strong>📝 Notes:</strong> ${l.notes || 'No notes.'}</p>
                        </div>
                    </div>
                `;
                }).join('');
            }
        }

        function toggleView(showQueue) {
            const dash = document.getElementById('dashboard-view');
            const queue = document.getElementById('wa-queue-view');
            if (showQueue) {
                dash.classList.add('hidden');
                queue.classList.remove('hidden');
            } else {
                queue.classList.add('hidden');
                dash.classList.remove('hidden');
            }
        }

        function resetDatabase() {
            if (confirm('Reset database?')) {
                localStorage.clear();
                leads = defaultLeads;
                saveData();
                location.reload();
            }
        }

        function exportCSV() {
            let csv = 'Company,Category,Status,WhatsApp Sent,Mobile,Website,Notes\n';
            leads.forEach(l => {
                csv += `"${l.company || ''}","${l.category || ''}","${l.status || 'New'}","${l.waSent ? 'Yes' : 'No'}","${l.mobile || ''}","${l.website || ''}","${(l.notes || '').replace(/"/g, '""')}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'buyer_database_export.csv';
            a.click();
        }

        window.onload = init;
    </script>
</body>
</html>
