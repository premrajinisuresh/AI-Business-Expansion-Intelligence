<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buyer Database v5 — Auto-Collected</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background:#f2f3f5; color:#222; }
  .wrap { max-width: 600px; width: 100%; margin: 0 auto; padding: 20px 16px 60px; box-sizing: border-box; }
  .nav-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .btn-queue { display:inline-block; color:#fff; background:#25D366; padding:8px 16px; border-radius:20px; font-size:0.85rem; font-weight:700; text-decoration:none; }
  h1 { font-size:1.3rem; color:#1d3557; margin:0 0 6px; }
  .meta { font-size:0.8rem; color:#666; margin-bottom:18px; background:#fff; padding:10px 14px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:18px; }
  .stats div { background:#fff; border-radius:10px; padding:8px 4px; text-align:center; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
  .stats span.num { display:block; font-size:1.1rem; font-weight:800; color:#1d3557; }
  .stats span.label { font-size:0.6rem; color:#666; }
  .filters { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .filter-row { display:flex; gap:10px; }
  select, input { width:100%; padding:10px; border:1px solid #ddd; border-radius:10px; font-size:0.9rem; font-family:inherit; background:#fff; }
  .action-row { display:flex; gap:10px; margin-bottom:18px; }
  .action-row button { flex:1; padding:10px; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
  #refreshBtn { background:#1d3557; color:#fff; }
  #exportBtn { background:#d4a373; color:#fff; }
  .card { background:#fff; border-radius:16px; padding:16px; box-shadow:0 3px 10px rgba(0,0,0,0.08); margin-bottom:14px; width:100%; }
  .card .header-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .card h2 { font-size:1.05rem; margin:0 0 2px; color:#111; word-break: break-word; }
  .card .category { font-size:0.75rem; color:#666; margin-bottom:8px; }
  .card .details { font-size:0.85rem; color:#444; margin-bottom:12px; line-height:1.4; word-break: break-word; }
  .card .details div { margin-bottom:4px; }
  .btn-group { display: flex; gap: 8px; width: 100%; }
  .wa-btn { display:block; flex: 1; text-align:center; background:#25D366; color:#fff; padding:12px; border-radius:10px; font-weight:700; text-decoration:none; box-shadow:0 2px 5px rgba(0,0,0,0.1); font-size:0.85rem; }
  .email-btn { display:block; flex: 1; text-align:center; background:#1d3557; color:#fff; padding:12px; border-radius:10px; font-weight:700; text-decoration:none; box-shadow:0 2px 5px rgba(0,0,0,0.1); font-size:0.85rem; }
  .empty { text-align:center; padding:30px; color:#666; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav-bar">
    <h1>📊 Buyer Database v5</h1>
    <a href="whatsapp-queue.html" class="btn-queue">💬 WhatsApp Queue</a>
  </div>
  <div class="meta" id="metaInfo">Loading database status...</div>
  
  <div class="stats">
    <div><span class="num" id="statTotal">0</span><span class="label">Total Leads</span></div>
    <div><span class="num" id="statNew">0</span><span class="label">New</span></div>
    <div><span class="num" id="statContacted">0</span><span class="label">Contacted</span></div>
    <div><span class="num" id="statInterested">0</span><span class="label">Interested</span></div>
  </div>

  <div class="filters">
    <select id="categoryFilter"><option value="">All Categories</option></select>
    <div class="filter-row">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="New">New</option>
        <option value="Contacted">Contacted</option>
        <option value="Interested">Interested</option>
        <option value="Skipped">Skipped</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search company or notes..." />
    </div>
  </div>

  <div class="action-row">
    <button id="refreshBtn">🔄 Refresh</button>
    <button id="exportBtn">⬇ Export CSV</button>
  </div>

  <div id="cardList"></div>
</div>

<script>
const DB_URL = "buyerdatabase5.json";
const STATUS_KEY = "buyer_statuses_v1";

const CATEGORY_MESSAGES = {
  "Hotels & Highway Hospitality":
    "Hello, I have a 23.5 cent corner land at Alagarkovil, Madurai — 4-lane highway frontage, strong temple/tourism footfall nearby. Could suit a hotel branch. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Restaurants & Food Courts":
    "Hello, sharing a 23.5 cent highway-corner land at Alagarkovil, Madurai — steady tourism + college traffic, good fit for a restaurant/food court. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Local Madurai Investors & Business Families":
    "Hello, sharing a solid investment opportunity — 23.5 cent corner land at Alagarkovil, Madurai, just 16 km from the city. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Hospitals & Healthcare Groups":
    "Hello, I have a 23.5 cent corner land at Alagarkovil, Madurai — highway-facing, near colleges too. Could suit a new hospital/clinic branch. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Educational Trusts & Colleges":
    "Hello, sharing a 23.5 cent plot at Alagarkovil, Madurai, right in an existing education corridor. Good fit for a new campus? Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "NRI & Diaspora Investors":
    "Hello, sharing an investment opportunity — 23.5 cent corner land at Alagarkovil, Madurai, close to Alagar Kovil Temple. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Temple & Charitable Trusts":
    "Hello, sharing a 23.5 cent corner land at Alagarkovil, Madurai, close to Alagar Kovil Temple — may suit trust-owned development. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Wedding & Convention Halls":
    "Hello, I have a 23.5 cent highway-corner land at Alagarkovil, Madurai — good size and visibility for a wedding/convention hall. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Highway Fuel, EV & Logistics":
    "Hello, sharing a 23.5 cent corner land on a 4-lane highway at Alagarkovil, Madurai — good fit for a fuel station, EV charging point, or logistics facility. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Franchise Master Operators":
    "Hello, I have a 23.5 cent highway-corner land at Alagarkovil, Madurai — could suit a new franchise outlet location. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Government / PPP Institutional":
    "Hello, sharing a 23.5 cent corner land at Alagarkovil, Madurai that may suit a government or PPP tourism/infrastructure project. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Funded Startups / Scaleups":
    "Hello, sharing a 23.5 cent corner land at Alagarkovil, Madurai — could suit a new physical location as you expand into Tamil Nadu. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930",
  "Institutional Property Consultants":
    "Hello, sharing a 23.5 cent corner land at Alagarkovil, Madurai — could be a good fit to recommend to your hospital, college, or hotel clients scouting sites in this region. Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930"
};
const DEFAULT_MESSAGE =
  "Hello, sharing a 23.5 cent prime corner commercial land at Alagarkovil, Madurai (16 km from the city). Direct owner sale, ₹25 Lakhs/cent, negotiable.\n\nPlease find the detailed property flyer and exact site-to-scale plan attached above. Shall I share the exact Google Maps location pin or arrange a brief call?\n\n— Prof. Dr. Suresh Kumar, Structural & Software Engineer, +91 9884198930";

let dbData = { companies: [] };
let statuses = {};

function hasValue(v) {
  return v !== undefined && v !== null && String(v).trim() !== "" && v !== "Not public";
}

function extractWaNumber(company) {
  if (hasValue(company.WhatsApp)) {
    for (const part of String(company.WhatsApp).split(/[,/|]/)) {
      const match = part.match(/(\d{10,15})/);
      if (match) return match[1];
    }
  }
  for (const field of [company.Mobile, company.Phone]) {
    if (!hasValue(field)) continue;
    for (const part of String(field).split(/[,/|]/)) {
      const digits = part.replace(/\D/g, "");
      if (digits.length === 10 && /^[6-9]/.test(digits)) return "91" + digits;
      if (digits.length === 12 && digits.startsWith("91") && /^91[6-9]/.test(digits)) return digits;
    }
  }
  return null;
}

function extractEmail(company) {
  if (hasValue(company.Email)) {
    const parts = String(company.Email).split(/[,/|]/);
    for (const p of parts) {
      const trimmed = p.trim();
      if (trimmed.includes("@")) return trimmed;
    }
  }
  return "";
}

function getCompanyKey(c) {
  return c.id || (c.Company ? c.Company.trim().toLowerCase() : "");
}

function loadStatuses() {
  try {
    let raw = localStorage.getItem(STATUS_KEY);
    if (raw) return JSON.parse(raw);
    
    raw = localStorage.getItem("buyer_statuses");
    if (raw) return JSON.parse(raw);

    raw = localStorage.getItem("wa_queue_handled_v1");
    if (raw) {
      const oldQueue = JSON.parse(raw);
      const mapped = {};
      for (const id in oldQueue) {
        if (oldQueue[id] === "sent") mapped[id] = "Contacted";
        else if (oldQueue[id] === "skipped") mapped[id] = "Skipped";
      }
      return mapped;
    }
  } catch (e) {}
  return {};
}

function saveStatuses() {
  localStorage.setItem(STATUS_KEY, JSON.stringify(statuses));
}

async function init() {
  statuses = loadStatuses();
  try {
    const res = await fetch(DB_URL + "?t=" + Date.now());
    dbData = await res.json();
  } catch (e) {
    document.getElementById("cardList").innerHTML = `<div class="empty">Could not load buyerdatabase5.json</div>`;
    return;
  }

  setupFilters();
  render();

  document.getElementById("refreshBtn").addEventListener("click", init);
  document.getElementById("categoryFilter").addEventListener("change", render);
  document.getElementById("statusFilter").addEventListener("change", render);
  document.getElementById("searchInput").addEventListener("input", render);
  document.getElementById("exportBtn").addEventListener("click", exportCsv);
}

function setupFilters() {
  const cats = [...new Set(dbData.companies.map(c => c.Category).filter(Boolean))].sort();
  const sel = document.getElementById("categoryFilter");
  sel.innerHTML = '<option value="">All Categories</option>' + cats.map(cat => `<option value="${cat}">${cat}</option>`).join("");
}

function render() {
  const companies = dbData.companies || [];
  const meta = dbData.meta || {};
  const lastRunTime = dbData.lastRun || meta.lastRun;
  const addedCount = dbData.addedThisRun ?? dbData.lastRunAdded ?? meta.addedThisRun ?? 0;

  const metaEl = document.getElementById("metaInfo");
  if (lastRunTime) {
    const last = new Date(lastRunTime);
    metaEl.textContent = `Last automated run: ${last.toLocaleString()} · Added ${addedCount} new lead(s) · ${companies.length} total`;
  } else {
    metaEl.textContent = `Total leads in database: ${companies.length}`;
  }

  let newCount = 0, contactedCount = 0, interestedCount = 0;
  companies.forEach(c => {
    const key = getCompanyKey(c);
    const altKey = c.Company ? c.Company.trim().toLowerCase() : "";
    const s = statuses[c.id] || statuses[key] || statuses[altKey] || "New";
    if (s === "New") newCount++;
    else if (s === "Contacted") contactedCount++;
    else if (s === "Interested") interestedCount++;
  });

  document.getElementById("statTotal").textContent = companies.length;
  document.getElementById("statNew").textContent = newCount;
  document.getElementById("statContacted").textContent = contactedCount;
  document.getElementById("statInterested").textContent = interestedCount;

  const catFilter = document.getElementById("categoryFilter").value;
  const statFilter = document.getElementById("statusFilter").value;
  const search = document.getElementById("searchInput").value.toLowerCase();

  const filtered = companies.filter(c => {
    const key = getCompanyKey(c);
    const altKey = c.Company ? c.Company.trim().toLowerCase() : "";
    const status = statuses[c.id] || statuses[key] || statuses[altKey] || "New";
    if (catFilter && c.Category !== catFilter) return false;
    if (statFilter && status !== statFilter) return false;
    if (search) {
      const text = (c.Company + " " + (c.Notes || "") + " " + (c.Address || "")).toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });

  const listEl = document.getElementById("cardList");
  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty">No matching leads found.</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(c => {
    const key = getCompanyKey(c);
    const altKey = c.Company ? c.Company.trim().toLowerCase() : "";
    const status = statuses[c.id] || statuses[key] || statuses[altKey] || "New";
    const waNum = extractWaNumber(c);
    const emailAddr = extractEmail(c);
    const msg = CATEGORY_MESSAGES[c.Category] || DEFAULT_MESSAGE;
    const waUrl = waNum ? `https://wa.me/${waNum}?text=${encodeURIComponent(msg)}` : "#";
    
    const emailSubject = encodeURIComponent("Prime Commercial Land Opportunity at Alagarkovil, Madurai (23.5 Cents)");
    const emailBody = encodeURIComponent(msg);
    const emailUrl = `mailto:${emailAddr}?subject=${emailSubject}&body=${emailBody}`;

    return `
      <div class="card">
        <div class="header-row">
          <div>
            <h2>${c.Company || "(Unnamed)"}</h2>
            <div class="category">${c.Category || "Uncategorized"}</div>
          </div>
          <select onchange="updateStatus('${c.id}', '${encodeURIComponent(c.Company || '')}', this.value)" style="width:auto; padding:4px 8px; font-size:0.8rem;">
            <option value="New" ${status === "New" ? "selected" : ""}>New</option>
            <option value="Contacted" ${status === "Contacted" ? "selected" : ""}>Contacted</option>
            <option value="Interested" ${status === "Interested" ? "selected" : ""}>Interested</option>
            <option value="Skipped" ${status === "Skipped" ? "selected" : ""}>Skipped</option>
          </select>
        </div>
        <div class="details">
          ${hasValue(c.Mobile) || hasValue(c.Phone) ? `<div>📱 <b>Mobile/Phone:</b> ${c.Mobile || c.Phone}</div>` : ""}
          ${hasValue(c.WhatsApp) ? `<div>💬 <b>WhatsApp:</b> ${c.WhatsApp}</div>` : ""}
          ${hasValue(c.Email) ? `<div>✉️ <b>Email:</b> ${c.Email}</div>` : ""}
          ${hasValue(c.Address) ? `<div>📍 <b>Address:</b> ${c.Address}</div>` : ""}
          ${hasValue(c.Website) ? `<div>🌐 <b>Website:</b> <a href="${c.Website}" target="_blank">${c.Website}</a></div>` : ""}
          ${hasValue(c.Notes) ? `<div>📝 <b>Notes:</b> ${c.Notes}</div>` : ""}
        </div>
        <div class="btn-group">
          ${waNum ? `<a href="${waUrl}" target="_blank" class="wa-btn">💬 WhatsApp</a>` : `<div style="text-align:center; color:#888; font-size:0.8rem; padding:12px; background:#eee; border-radius:10px; flex:1;">No WA/Phone</div>`}
          <a href="${emailUrl}" class="email-btn">✉️ Send Email</a>
        </div>
      </div>
    `;
  }).join("");
}

window.updateStatus = function(id, encodedCompany, val) {
  const companyName = decodeURIComponent(encodedCompany).trim().toLowerCase();
  if (id && id !== "undefined") statuses[id] = val;
  if (companyName) statuses[companyName] = val;
  saveStatuses();

  let newCount = 0, contactedCount = 0, interestedCount = 0;
  (dbData.companies || []).forEach(c => {
    const key = getCompanyKey(c);
    const altKey = c.Company ? c.Company.trim().toLowerCase() : "";
    const s = statuses[c.id] || statuses[key] || statuses[altKey] || "New";
    if (s === "New") newCount++;
    else if (s === "Contacted") contactedCount++;
    else if (s === "Interested") interestedCount++;
  });
  document.getElementById("statNew").textContent = newCount;
  document.getElementById("statContacted").textContent = contactedCount;
  document.getElementById("statInterested").textContent = interestedCount;
};

function exportCsv() {
  const companies = dbData.companies || [];
  if (companies.length === 0) return;
  let csv = "Company,Category,Mobile,WhatsApp,Email,Address,Website,Status,Notes\n";
  companies.forEach(c => {
    const key = getCompanyKey(c);
    const altKey = c.Company ? c.Company.trim().toLowerCase() : "";
    const status = statuses[c.id] || statuses[key] || statuses[altKey] || "New";
    const row = [
      `"${(c.Company || "").replace(/"/g, '""')}"`,
      `"${(c.Category || "").replace(/"/g, '""')}"`,
      `"${(c.Mobile || c.Phone || "").replace(/"/g, '""')}"`,
      `"${(c.WhatsApp || "").replace(/"/g, '""')}"`,
      `"${(c.Email || "").replace(/"/g, '""')}"`,
      `"${(c.Address || "").replace(/"/g, '""')}"`,
      `"${(c.Website || "").replace(/"/g, '""')}"`,
      `"${status}"`,
      `"${(c.Notes || "").replace(/"/g, '""')}"`
    ];
    csv += row.join(",") + "\n";
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "buyer-database-export.csv";
  a.click();
}

init();
</script>
</body>
</html>
