name: Enrich Buyers V6

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  enrich-buyers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4[span_6](start_span)[span_6](end_span)

      - name: Set up Node.js
        uses: actions/setup-node@v4[span_7](start_span)[span_7](end_span)
        with:
          node-version: "20[span_8](start_span)"[span_8](end_span)

      - name: Install dependencies
        run: npm install[span_9](start_span)[span_9](end_span)

      - name: Run enrichment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/enrich-buyers-v6.mjs[span_10](start_span)[span_10](end_span)

      - name: Commit updated database
        run: |
          git config user.name "buyer-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add buyerdatabase5.json
          git diff --quiet --cached || git commit -m "Enriched buyer database [skip ci][span_11](start_span)"[span_11](end_span)
